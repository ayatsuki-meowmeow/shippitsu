name: Shippitsu
options:
  bundleIdPrefix: com.ayatsukiaya
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"          # ad-hoc 署名。ローカル実行に必要な最小限
    CODE_SIGN_STYLE: Manual
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Shippitsu:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shippitsu
    settings:
      base:
        PRODUCT_NAME: Shippitsu
        PRODUCT_BUNDLE_IDENTIFIER: com.ayatsukiaya.shippitsu
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: 執筆
        CFBundleDisplayName: 執筆
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    scheme:
      testTargets:
        - ShippitsuTests

  ShippitsuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ShippitsuTests
    dependencies:
      - target: Shippitsu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
